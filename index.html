<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestorPro - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'blink-red': 'blink-red 1s infinite',
              'blink-orange': 'blink-orange 1.5s infinite',
            },
            keyframes: {
              'blink-red': {
                '0%, 100%': { borderColor: 'transparent', boxShadow: 'none' },
                '50%': { borderColor: '#ef4444', boxShadow: '0 0 10px #ef4444' },
              },
              'blink-orange': {
                '0%, 100%': { borderColor: 'transparent', boxShadow: 'none' },
                '50%': { borderColor: '#f97316', boxShadow: '0 0 10px #f97316' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-slate-800 antialiased">
    <div id="root"></div>
  </body>
</html>
